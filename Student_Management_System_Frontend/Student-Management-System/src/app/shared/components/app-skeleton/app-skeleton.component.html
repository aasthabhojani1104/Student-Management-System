@if (type === 'table') {
  <div class="skeleton-table">
    @for (row of rowsArray; track $index) {
      <div class="skeleton-row">
        @for (col of colsArray; track $index) {
          <div class="skeleton skeleton-text" [style.width]="$index === 0 ? '40px' : ($index === colsArray.length - 1 ? '80px' : '120px')"></div>
        }
      </div>
    }
  </div>
}

@if (type === 'card') {
  <div class="skeleton-cards">
    @for (row of rowsArray; track $index) {
      <div class="skeleton-card-item">
        <div class="skeleton skeleton-circle" style="width:40px;height:40px;flex-shrink:0"></div>
        <div class="skeleton-card-lines">
          <div class="skeleton skeleton-title" style="width:60%"></div>
          <div class="skeleton skeleton-text" style="width:40%;margin-top:6px"></div>
        </div>
      </div>
    }
  </div>
}

@if (type === 'text') {
  <div class="skeleton-text-block">
    @for (row of rowsArray; track $index) {
      <div class="skeleton skeleton-text" [style.width]="$index % 3 === 0 ? '100%' : ($index % 3 === 1 ? '80%' : '60%')"
           [style.margin-bottom]="'8px'"></div>
    }
  </div>
}
